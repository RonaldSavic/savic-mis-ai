[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# The distribution name uses a hyphen; the importable package uses an underscore.
name = "mis-ai"
version = "0.1.0"
description = "A project built on SAVIC Platform"
requires-python = ">=3.11"
dependencies = [
    # Pin to a platform release tag. The project's Docker image doesn't use
    # this line: it builds on the platform image, which already has it.
    "savic-common @ git+https://github.com/Savic-Technologies-Pvt-Ltd/Savic-Platform.git@v1.1.0#subdirectory=backend",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0", "httpx>=0.27.0", "ruff>=0.4.5"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["mis_ai"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
