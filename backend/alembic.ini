# This project's own migration history, apart from the platform's. Used for
# writing migrations:
#   alembic revision --autogenerate -m "add priority to tasks"
# Applying them is the migration owner's job, through the platform's init
# (python -m savic_common.extensions.init), never on app start.
# DATABASE_URL comes from the environment (see mis_ai/migrations/env.py).

[alembic]
script_location = mis_ai:migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
