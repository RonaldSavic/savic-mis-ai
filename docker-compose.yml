# Development: this project's backend (platform + project) on
# http://localhost:8000, against the local PostgreSQL service below. Run the
# frontend with Vite (see README.md); it sends /api to this backend.
#
#   cp .env.example .env            # adjust local passwords if required
#   docker compose up --build
#   open http://localhost:8000/docs
#
# Code under ./backend is mounted into the container: saving a file reloads
# the API. Nothing here migrates or seeds on start. The migration owner runs,
# on purpose:
#   docker compose run --rm init
# init reads .env, then .env.migrator (the schema-owning login), whose
# values override .env.

name: savic-mis-ai

x-backend: &backend
  build:
    context: ./backend
    target: dev
  env_file:
    - .env
  environment:
    DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-savic_app}:${POSTGRES_PASSWORD:-change-me-local-only}@db:5432/${POSTGRES_DB:-savic_platform}
  depends_on:
    db:
      condition: service_healthy
  volumes:
    - ./backend:/project
    - ./data:/project/data:ro
    - attachments:/app/storage

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-savic_platform}
      POSTGRES_USER: ${POSTGRES_USER:-savic_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    <<: *backend
    ports:
      - "8000:8000"

  # The platform's init (migrations and reference seeds, all idempotent),
  # then this project's migrations and menus, then the bootstrap seed, which
  # grants the administrator role the new menus too.
  init:
    <<: *backend
    profiles: ["init"]
    restart: "no"
    env_file:
      - .env
      - path: .env.migrator
        required: true
    command: >
      sh -c "alembic upgrade head &&
             python -m savic_common.db.seeds.seed_menu_master &&
             python -m savic_common.db.seeds.seed_app_config &&
             python -m savic_common.db.seeds.seed_colour_palettes &&
             python -m savic_common.db.seeds.seed_languages &&
             python -m savic_common.db.seeds.seed_master_data &&
             python -m savic_common.extensions.init &&
             python -m savic_common.db.seeds.seed_bootstrap_admin"

volumes:
  attachments:
  postgres_data:
