# Release 1.0.0 (Phase D). One origin for the browser: the built app at /,
# the backend at /api/. Same origin keeps the SameSite=Strict refresh cookie
# and the CORS/CSRF origin check simple — CORS_ORIGINS only needs this
# server's own address. /docs and /openapi.json are not proxied, so the API
# docs are not reachable through the shipped frontend.

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Attachments default to 10 MB per file (ATTACHMENT_MAX_FILE_SIZE_MB) and
    # several files can travel in one request. Raise this if a company's
    # override goes higher.
    client_max_body_size 100m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Docker's embedded DNS. With the upstream in a variable, nginx resolves
    # "backend" per request (cached 10s) instead of once at startup, so a
    # restarted backend container with a new IP is picked up without
    # restarting this one.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwritten, never appended: the backend trusts this header for the
        # client IP it records, so a browser-supplied value must not survive.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Vite's hashed build output never changes under the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Client-side routes (BrowserRouter): a refresh on /roles must still get
    # the app, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
