# Production stack for this project: the same shape as the platform's
# docker-compose.prod.yml, with this project's two images.
#
#   docker compose -f docker-compose.prod.yml build      # needs the platform image loaded
#   cp .env.example .env.prod                            # then fill it in for production
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#   open http://localhost:8080
#
# Only the frontend publishes a port; nginx proxies /api/ to the backend.

name: savic-mis-ai

x-backend: &backend
  image: savic-mis-ai-backend:0.1.0
  build:
    context: ./backend
    target: prod
  env_file:
    - .env.prod
  volumes:
    - attachments:/app/storage

services:
  # restart: always, as in the platform: Docker Desktop's Quit counts as a
  # manual stop, which unless-stopped would not recover from.
  backend:
    <<: *backend
    restart: always

  frontend:
    image: savic-mis-ai-frontend:0.1.0
    build:
      context: ./frontend
    ports:
      - "${SAVIC_HTTP_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: always

  # Migration owner only, on purpose. Same steps as docker-compose.yml's init.
  init:
    <<: *backend
    profiles: ["init"]
    restart: "no"
    env_file:
      - .env.prod
      - path: .env.migrator
        required: true
    command: >
      sh -c "alembic upgrade head &&
             python -m savic_common.db.seeds.seed_menu_master &&
             python -m savic_common.db.seeds.seed_app_config &&
             python -m savic_common.db.seeds.seed_colour_palettes &&
             python -m savic_common.db.seeds.seed_languages &&
             python -m savic_common.db.seeds.seed_master_data &&
             python -m savic_common.extensions.init &&
             python -m savic_common.db.seeds.seed_bootstrap_admin"

volumes:
  attachments:
